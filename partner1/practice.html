    <main class="content-box">
        <h1>Linux Skill Checklist</h1>
        <p>Boot up your local Virtual Machine, launch your personal Linux distribution of choice, and check off completed skills 
           as you progress.</p>
        <div class="skills-grid">
            <div class="skill-item">
                <label class="skill-label">
                    <input type="checkbox" class="skill-checkbox">
                    <span>Confirm directory path.  HINT: ~ is home and / is root. <code>pwd</code></span>
                </label>
            </div>
            <div class="skill-item">
                <label class="skill-label">
                    <input type="checkbox" class="skill-checkbox">
                    <span>Create a text file using, <code>touch Hello.txt</code></span>
                </label>
            </div>
                        <div class="skill-item">
                <label class="skill-label">
                    <input type="checkbox" class="skill-checkbox">
                    <span>View your directories, files, and permissions via, <code>ls -al</code></span>
                </label>
            </div>
            <div class="skill-item">
                <label class="skill-label">
                    <input type="checkbox" class="skill-checkbox">
                    <span>Test your network connection to Google's DNS.  HINT: ctrl+c to cancel.  <code>ping 8.8.8.8</code></span>
                </label>
            </div>
            <div class="skill-item">
                <label class="skill-label">
                    <input type="checkbox" class="skill-checkbox">
                    <span>Erase terminal of text. <code>clear</code></span>
                </label>
            </div>
        </div>
    </main>
